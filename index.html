<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="shortcut icon" href="https://www.youtube.com/s/desktop/5ccc1a49/img/favicon.ico" type="image/x-icon">
</head>
<body class="dark-mode">
    <div class="nav-bar">
        <div class="menu-bar glow"><i class="fa-solid fa-bars"></i></div>

        <img src="Resources/yt-logo.png" alt="yt-logo.png" class="yt-logo">

        <div class="search-container">
            <div class="search-input"><input type="text" placeholder="Search"></div>
            <button class="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
            <button class="mic-icon glow"><i class="fa-solid fa-microphone"></i></button>
        </div>

        <div class="user-container">
            <div class="bell glow"><i class="fa-regular fa-bell bell-icon"></i></div>
            <div class="profile glow"><i class="fa-solid fa-user"></i></div>
        </div>

    </div>

    <div class="main-container">

        <div class="side-bar">
            <div class="home glow-dark">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </div>

            <div class="shorts glow-dark">
                <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24" focusable="false" aria-hidden="true" style="pointer-events: none; display: inherit; width: 100%; height: 100%;"><path d="m13.467 1.19-8 4.7a5 5 0 00-.255 8.46 5 5 0 005.32 8.462l8-4.7a5 5 0 00.258-8.462 5 5 0 001.641-6.464l-.12-.217a5 5 0 00-6.844-1.78m5.12 2.79a2.999 2.999 0 01-1.067 4.107l-1.327.78a1 1 0 00.096 1.775l.943.423a3 3 0 01.288 5.323l-8 4.7a3 3 0 01-3.039-5.173l1.327-.78a1 1 0 00-.097-1.775l-.942-.423a3 3 0 01-.288-5.323l8-4.7a3 3 0 014.106 1.066ZM15 12l-5-3v6l5-3Z"></path></svg>   
                <span>Shorts</span>
            </div>

            <div class="subscriptions glow-dark">
                <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24"><path d="M18 1H6a2 2 0 00-2 2h16a2 2 0 00-2-2Zm3 4H3a2 2 0 00-2 2v13a2 2 0 002 2h18a2 2 0 002-2V7a2 2 0 00-2-2ZM3 20V7h18v13H3Zm13-6.5L10 10v7l6-3.5Z"/></svg>                
                <span>Subscriptions</span>
            </div>

            <div class="user glow-dark">
                <i class="fa-regular fa-circle-user"></i>
                <span>You</span>
            </div>

        </div>

        <div class="content">

            <div class="suggestion-bar">
                <div class="suggestion" style="background-color: white; color: black;">All</div>
                <div class="suggestion">Music</div>
                <div class="suggestion">Movie</div>
                <div class="suggestion">Gaming</div>
                <div class="suggestion">Science</div>
            </div>

            <div class="video-section"></div>
        </div>
        
    </div>
    
    <script src="app.js"></script>
</body>
</html>
