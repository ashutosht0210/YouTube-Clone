<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="dark-mode">
    <div class="nav-bar">
        <div class="menu-bar glow"><i class="fa-solid fa-bars"></i></div>
        <img src="Resources/yt-logo.png" alt="yt-logo.png" class="yt-logo">
        <div class="search-container">
            <div class="search-input"><input type="text" placeholder="Search"></div>
            <button class="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
            <button class="mic-icon glow"><i class="fa-solid fa-microphone"></i></button>
        </div>
        <div class="user-container">
            <div class="bell glow"><i class="fa-regular fa-bell bell-icon"></i></div>
            <div class="profile glow"><i class="fa-solid fa-user"></i></div>
        </div>
    </div>

    <div class="main-container">
        <div class="side-bar">
            <div class="home"></div>
            <div class="shorts"></div>
            <div class="subscription"></div>
            <div class="user"></div>
        </div>
        <div class="content"></div>
    </div>
    
</body>
</html>
